# Slack app manifest for Simple Schedules Transcribe.
#
# Creates a USER-token app so transcripts post as you (not a bot).
#
# Scopes: two to upload a .md file and share it into a channel, plus history so
# Simple Org can read #möte and spot agreed meeting times. History is read-only
# and covers the channels you are already in — the token cannot see anything
# you cannot.
#
# Use it: api.slack.com/apps -> Create New App -> From an app manifest ->
# pick the Simple Schedules workspace -> paste this (YAML tab) -> Create ->
# Install to Workspace -> copy the User OAuth Token (xoxp-...) into settings.ini.
#
# ALREADY INSTALLED? Adding scopes needs a REINSTALL: api.slack.com/apps ->
# your app -> OAuth & Permissions -> add the user scopes above -> "Reinstall to
# Workspace" -> copy the NEW xoxp- token into settings.ini. The old token keeps
# working for posting but will keep failing history with missing_scope.
display_information:
  name: SS Transcribe
  description: Shares finished meeting transcripts into Slack
  background_color: "#4a4ae0"
oauth_config:
  scopes:
    user:
      - files:write
      - chat:write
      # Read #möte, so Simple Org can find agreed meeting times.
      - channels:history
      # Same, if the channel is private.
      - groups:history
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
